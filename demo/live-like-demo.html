<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>直播间点赞动画 Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background: #090b12;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .phone-page {
        position: relative;
        width: min(100vw, 430px);
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        color: #fff;
        background:
          radial-gradient(circle at 24% 16%, rgba(255, 120, 170, 0.34), transparent 28%),
          radial-gradient(circle at 76% 8%, rgba(98, 179, 255, 0.26), transparent 32%),
          linear-gradient(180deg, #15182b 0%, #11111b 50%, #080910 100%);
      }

      .phone-page::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 22%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.62), transparent 42%);
        pointer-events: none;
      }

      .live-header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 16px 0;
      }

      .anchor-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 8px 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px);
      }

      .avatar {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff7a9a, #ffd36a);
        font-size: 20px;
      }

      .anchor-name {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .anchor-meta {
        margin: 2px 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 11px;
      }

      .live-badge {
        padding: 7px 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff2b77, #ff6d3f);
        box-shadow: 0 8px 26px rgba(255, 43, 119, 0.35);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .live-content {
        position: absolute;
        right: 16px;
        bottom: calc(130px + var(--safe-bottom));
        left: 16px;
        z-index: 1;
      }

      .live-title {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.25;
      }

      .message-list {
        display: grid;
        gap: 8px;
        max-width: 82%;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .message-list li {
        width: fit-content;
        max-width: 100%;
        padding: 7px 10px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.88);
        background: rgba(0, 0, 0, 0.28);
        font-size: 13px;
        backdrop-filter: blur(12px);
      }

      .like-panel {
        position: fixed;
        right: max(18px, env(safe-area-inset-right, 0px));
        bottom: calc(28px + var(--safe-bottom));
        z-index: 5;
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .like-stage {
        position: absolute;
        right: 4px;
        bottom: 56px;
        width: 120px;
        height: 330px;
        overflow: visible;
        pointer-events: none;
      }

      .like-float {
        position: absolute;
        right: 18px;
        bottom: 0;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.45) rotate(var(--rotate));
        animation: float-like var(--duration) cubic-bezier(0.19, 0.78, 0.34, 1) forwards;
        will-change: transform, opacity;
      }

      .like-float::before {
        content: attr(data-emoji);
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.26));
        font-size: var(--size);
        animation: emoji-sway var(--duration) ease-in-out forwards;
      }

      .like-button {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background:
          radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.42), transparent 32%),
          linear-gradient(135deg, #ff4c87, #ff7c40);
        box-shadow:
          0 12px 30px rgba(255, 74, 126, 0.38),
          inset 0 -3px 8px rgba(134, 24, 45, 0.28);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 160ms ease,
          filter 160ms ease;
      }

      .like-button:active {
        transform: scale(0.9);
        filter: brightness(1.08);
      }

      .like-button.is-popping {
        animation: button-pop 360ms ease;
      }

      .like-icon {
        font-size: 27px;
        line-height: 1;
        transform: translateY(-1px);
      }

      .like-count {
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.26);
        color: rgba(255, 255, 255, 0.86);
        font-size: 12px;
        backdrop-filter: blur(10px);
      }

      @keyframes float-like {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(0.45) rotate(var(--rotate));
        }

        10% {
          opacity: 1;
          transform: translate3d(calc(var(--x) * 0.12), -28px, 0) scale(1) rotate(calc(var(--rotate) * 0.6));
        }

        46% {
          opacity: 0.96;
          transform: translate3d(calc(var(--x) * 0.72), calc(var(--rise) * -0.48), 0) scale(1.08) rotate(calc(var(--rotate) * -0.35));
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--x), calc(var(--rise) * -1), 0) scale(0.82) rotate(0deg);
        }
      }

      @keyframes emoji-sway {
        0%,
        100% {
          transform: translateX(0);
        }

        28% {
          transform: translateX(calc(var(--sway) * -0.45));
        }

        62% {
          transform: translateX(var(--sway));
        }
      }

      @keyframes button-pop {
        0%,
        100% {
          transform: scale(1);
        }

        42% {
          transform: scale(1.14);
        }
      }
    </style>
  </head>
  <body>
    <main class="phone-page" aria-label="直播间点赞动画示例">
      <header class="live-header">
        <section class="anchor-card" aria-label="主播信息">
          <div class="avatar" aria-hidden="true">🌟</div>
          <div>
            <p class="anchor-name">星夜直播间</p>
            <p class="anchor-meta">12.8w 人正在看</p>
          </div>
        </section>
        <div class="live-badge">LIVE</div>
      </header>

      <section class="live-content">
        <h1 class="live-title">点击右下角点赞按钮，弹出小表情包</h1>
        <ul class="message-list" aria-label="直播间消息">
          <li>小鹿：这个效果好丝滑！</li>
          <li>April：喜欢这个气泡轨迹</li>
          <li>System：欢迎来到直播间</li>
        </ul>
      </section>

      <section class="like-panel" aria-label="直播间点赞">
        <div class="like-stage" id="likeStage" aria-hidden="true"></div>
        <button class="like-button" id="likeButton" type="button" aria-label="点赞">
          <span class="like-icon" aria-hidden="true">👍</span>
        </button>
        <div class="like-count"><span id="likeCount">1280</span> 赞</div>
      </section>
    </main>

    <script>
      const emojis = ["😀", "🤣", "❤️", "😻", "👏", "🤘", "🤩", "👍", "🎈", "💕", "💓", "💚"];
      const stage = document.querySelector("#likeStage");
      const button = document.querySelector("#likeButton");
      const count = document.querySelector("#likeCount");
      let likeCount = Number(count.textContent);

      const random = (min, max) => Math.random() * (max - min) + min;

      function spawnLike() {
        const bubble = document.createElement("span");
        const x = random(-86, 18);
        const rise = random(210, 310);
        const duration = random(1600, 2400);

        bubble.className = "like-float";
        bubble.dataset.emoji = emojis[Math.floor(Math.random() * emojis.length)];
        bubble.style.setProperty("--x", `${x}px`);
        bubble.style.setProperty("--rise", `${rise}px`);
        bubble.style.setProperty("--duration", `${duration}ms`);
        bubble.style.setProperty("--rotate", `${random(-28, 28)}deg`);
        bubble.style.setProperty("--sway", `${random(8, 22)}px`);
        bubble.style.setProperty("--size", `${random(25, 34)}px`);

        stage.appendChild(bubble);
        bubble.addEventListener("animationend", () => bubble.remove(), { once: true });
      }

      function handleLike() {
        likeCount += 1;
        count.textContent = String(likeCount);
        button.classList.remove("is-popping");
        void button.offsetWidth;
        button.classList.add("is-popping");

        const amount = Math.floor(random(4, 7));
        for (let i = 0; i < amount; i += 1) {
          window.setTimeout(spawnLike, i * random(55, 95));
        }
      }

      button.addEventListener("click", handleLike);
    </script>
  </body>
</html>
